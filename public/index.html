<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Chat App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 640px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.6;
        }

        #messages {
            list-style: none;
            padding: 0.75rem;
            margin: 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            min-height: 260px;
            max-height: 60vh;
            overflow-y: auto;
            background: #f7f7f7;
        }

        #messages li {
            margin-bottom: 0.75rem;
            padding: 0.65rem 0.85rem;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        #chat-form {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        #chat-input {
            flex: 1;
            padding: 0.85rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 0.85rem 1.2rem;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #0056d6;
        }
    </style>
</head>

<body>
    <h1>Socket.IO Chat App</h1>

    <ul id="messages"></ul>

    <div>
        <input id="chat-input" autocomplete="off" placeholder="Type your message" />
        <button id="send">Send</button>
    </div>
    <script src="https://smitchatappwebsocketbe-production.up.railway.app/socket.io/socket.io.js"></script>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <!-- <script src="/socket.io/socket.io.js"></script> -->
    <script src="app.js"></script>
</body>

</html>
