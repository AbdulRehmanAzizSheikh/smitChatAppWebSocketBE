services:
  # 1. Backend Service (Web Service for WebSockets)
  - type: web
    name: smit-chat-backend
    env: node
    plan: free
    buildCommand: npm install # Ya agar backend folder alag hai toh: cd backend && npm install
    startCommand: npm start   # Ya: cd backend && npm start
    envVars:
      - key: MONGO_URI
        value: your_mongodb_connection_string_here
      - key: PORT
        value: 10000

  # 2. Frontend Service (Static Site)
  - type: web
    name: smit-chat-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build # Agar React/Vite hai
    publishDir: dist # React/Vite ke liye dist ya build folder
    envVars:
      - key: BACKEND_URL
        value: https://smit-chat-backend.onrender.com # Aapke backend ka URL